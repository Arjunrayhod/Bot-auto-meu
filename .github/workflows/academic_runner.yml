name: Academic Auto Bot Ghost Cloud Runner

on:
  schedule:
    # Run every 30 minutes 24/7 on Microsoft GitHub Cloud
    - cron: '*/30 * * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [telegram_trigger, scan_solve, email_alert]

jobs:
  run-ghost-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright & Chromium
        run: |
          playwright install --with-deps chromium

      - name: Inject Environment Configuration
        env:
          ENV_SECRET: ${{ secrets.ENV_FILE }}
        run: |
          if [ -n "$ENV_SECRET" ]; then
            echo "$ENV_SECRET" > .env
          else
            cat << 'EOF' > .env
          PORTAL_LOGIN_URL=${{ secrets.PORTAL_LOGIN_URL || 'https://meu.gnums.co.in/Login.aspx' }}
          PORTAL_DASHBOARD_URL=${{ secrets.PORTAL_DASHBOARD_URL || 'https://meu.gnums.co.in/StudentPanel/StudentDashboard.aspx' }}
          PORTAL_ROLE=${{ secrets.PORTAL_ROLE || 'Student' }}
          PORTAL_USERNAME=${{ secrets.PORTAL_USERNAME }}
          PORTAL_PASSWORD=${{ secrets.PORTAL_PASSWORD }}
          TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID=${{ secrets.TELEGRAM_CHAT_ID }}
          LLM_PROVIDER=${{ secrets.LLM_PROVIDER || 'gemini' }}
          GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL=${{ secrets.GEMINI_MODEL || 'gemini-3.5-flash-lite' }}
          GEMINI_BASE_URL=https://generativelanguage.googleapis.com/v1beta/openai/
          HEADLESS=True
          CHECK_INTERVAL_SECONDS=900
          SERVER_ERROR_WAIT_SECONDS=300
          MAX_RETRIES=3
          QUIZ_SAFETY_TIMER_RATIO=0.80
          GMAIL_USER=${{ secrets.GMAIL_USER || secrets.PORTAL_USERNAME }}
          GMAIL_APP_PASSWORD=${{ secrets.GMAIL_APP_PASSWORD }}
          EOF
          fi

      - name: Execute Autonomous Academic Bot Cycle
        run: |
          python -m src.main --once

      - name: Commit & Sync Updated State Cache
        if: always()
        run: |
          git config --global user.name "GhostCloudBot"
          git config --global user.email "bot@ghostcloud.meu"
          git add state/seen_tasks.json state/seen_emails.json state/attendance_cache.json state/marks_cache.json state/deadlines_cache.json 2>/dev/null || true
          git diff --staged --quiet || (git commit -m "chore(state): sync task ledger from cloud run [skip ci]" && git push)
